name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Both, and the second is not redundancy. A guard that asks the filesystem
    # a question gets a different answer on case-insensitive APFS than on ext4,
    # and this repository has already shipped one that was green on
    # ubuntu-latest and red in under a second for every macOS contributor. The
    # Makefile carries a paragraph about macOS's make 3.81 for the same reason.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOCACHE: /tmp/looprig-host-gocache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run repository checks
        run: GOWORK=off make check
